[project]
name = "reels-factory"
version = "0.1.0"
description = "Fabrica semiautomática de Reels/Shorts verticales (9:16) con IA"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
    "pytest>=8.0",
]

[project.scripts]
reels = "reels.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]